name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux amd64
            binary: prompt-cli
            archive: tar.gz
            goos: linux
          - os: windows-latest
            label: Windows amd64
            binary: prompt-cli.exe
            archive: zip
            goos: windows
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64
      GOOS: ${{ matrix.goos }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build
        shell: bash
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/juanandrade/prompt-cli/internal/app.Version=${VERSION}"
          -o "dist/${{ matrix.binary }}" ./cmd/prompt-cli
      - name: Package Linux archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="prompt-cli_${VERSION}_linux_amd64.tar.gz"
          tar -C dist -czf "dist/${asset}" prompt-cli
          sha256sum "dist/${asset}" | sed "s#dist/##" > "dist/${asset}.sha256"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "prompt-cli_$env:VERSION`_windows_amd64.zip"
          Compress-Archive -Path dist/prompt-cli.exe -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline "dist/$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-cli-${{ matrix.os }}
          path: dist/prompt-cli_${{ github.ref_name }}_*.${{ matrix.archive }}*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
